name: Daily Salesforce Sync & Build

on:
  repository_dispatch:
    types: [salesforce-sync]
  workflow_dispatch:
  push:
    paths:
      - 'data/raw/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dashboard Build Engine
        run: |
          python ingest/build_data.py

      - name: Deploy Live Dashboard
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add dist/ index.html data/
          git commit -m "Auto-sync: Updated live dashboard with latest Salesforce C360 data" || exit 0
          git push
