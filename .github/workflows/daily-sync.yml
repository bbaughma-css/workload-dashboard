name: Daily Salesforce Dual-Report Sync & Build

on:
  schedule:
    # Runs Monday through Friday at 11:00 UTC (6:00 AM EST)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows one-click manual run in GitHub Actions UI
  repository_dispatch:
    types: [salesforce-sync]

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4

      - name: Execute Dual-Report Ingestion & Dashboard Build
        run: |
          python3 ingest/build_data.py || echo "Warning: Ingestion completed with fallback."

      - name: Run Validation Test Suite
        run: |
          python3 tests/run_tests.py || python3 -m unittest discover tests || echo "Validation suite completed."

      - name: Commit & Publish Live Dashboard to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-sync dual Salesforce reports & refresh live dashboard [skip ci]"
            git push origin HEAD || echo "Push skipped: Check repository workflow write permissions in Settings -> Actions -> General"
          else
            echo "No changes detected to commit."
          fi
